          CSS

          cat > web/sw.js <<'JS'
          const SHELL_CACHE='slide-tales-shell-v2';
          const IMAGE_CACHE='slide-tales-images-v2';
          const SHELL=['./','./index.html','./styles.css','./app.js'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(SHELL_CACHE).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>![SHELL_CACHE,IMAGE_CACHE].includes(k)).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{
            const r=e.request; if(r.method!=='GET') return; const u=new URL(r.url); if(u.origin!==self.location.origin) return;
            if(r.destination==='image'||u.pathname.includes('/assets/')){
              e.respondWith(caches.open(IMAGE_CACHE).then(async c=>{const hit=await c.match(r);if(hit)return hit;try{const res=await fetch(r);if(res.ok)c.put(r,res.clone());return res}catch(_){return hit||Response.error()}}));return;
            }
            if(r.mode==='navigate'){e.respondWith(fetch(r).catch(()=>caches.match('./index.html')));return}
            e.respondWith(caches.match(r).then(hit=>hit||fetch(r)));
          });
          JS

          cat > web/_headers <<'HDR'
          /assets/*
            Cache-Control: public, max-age=2592000, stale-while-revalidate=86400

          /app.js
            Cache-Control: public, max-age=3600, must-revalidate

          /styles.css
            Cache-Control: public, max-age=3600, must-revalidate

          /sw.js
            Cache-Control: no-cache

          /index.html
            Cache-Control: no-cache
          HDR

          node --check web/app.js

      - name: Force retro logo and internal help menus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('web/app.js')
          s = p.read_text()

          header = """  function header() {
            return '<header class="topbar">' +
              '<button class="icon-btn" data-action="info" aria-label="How to play">?</button>' +
              '<div class="logo retro-logo"><span class="retro-word">RETRO</span><span class="slide-word">SLIDE TALES</span></div>' +
              '<div class="star-badge" aria-label="Total stars">★ ' + totalStars() + '</div>' +
            '</header>';
          }"""
          s = re.sub(r"  function header\(\) \{.*?\n  \}", header, s, count=1, flags=re.S)

          info_screen = """  function renderInfo() {
            return shell('<section class="screen info-screen">' +
              '<div class="title-row"><button class="back" data-action="back-from-info">←</button><div><h1>HOW TO PLAY</h1><p>Quick rules.</p></div></div>' +
              '<div class="rules-grid">' +
                '<article class="rule-card blue"><b>1</b><div><h3>TAP IN LINE</h3><p>Tap a tile in the same row or column as the empty space.</p></div></article>' +
                '<article class="rule-card salmon"><b>2</b><div><h3>SLIDE THE STRIP</h3><p>Every tile between your choice and the gap moves together.</p></div></article>' +
                '<article class="rule-card green"><b>3</b><div><h3>SOLVE SMART</h3><p>HINT shows the picture. GUIDE shows the solve path.</p></div></article>' +
              '</div>' +
              '<div class="rule-tools"><span><strong>HINT</strong>Picture</span><span><strong>GUIDE</strong>Steps</span><span><strong>MIX</strong>New shuffle</span><span><strong>RESET</strong>Restart</span></div>' +
              '<button class="action black" data-action="back-from-info">GOT IT</button>' +
            '</section>');
          }"""
          if "function renderInfo()" not in s:
            s = s.replace("  function render() {", info_screen + "\n\n  function render() {")

          render = """  function render() {
            if (state.screen === 'home') app.innerHTML = renderHome();
            else if (state.screen === 'collection') app.innerHTML = renderCollection();
            else if (state.screen === 'game') app.innerHTML = renderGame();
            else if (state.screen === 'help') app.innerHTML = renderHelp();
            else app.innerHTML = renderInfo();
          }"""
          s = re.sub(r"  function render\(\) \{.*?\n  \}", render, s, count=1, flags=re.S)

          howto = """  function showHowToPlay() {
            state.helpReturn = state.screen === 'game' ? 'game' : state.screen === 'collection' ? 'collection' : 'home';
            state.guide = false;
            state.hint = false;
            state.screen = 'info';
            state.running = false;
            render();
          }"""
          s = re.sub(r"  function showHowToPlay\(\) \{.*?\n  \}", howto, s, count=1, flags=re.S)

          s = s.replace("data-action=\"settings\" aria-label=\"How to play\"", "data-action=\"info\" aria-label=\"How to play\"")
          s = s.replace("data-action=\"settings\">?<span>HOW TO PLAY</span>", "data-action=\"info\">?<span>HOW TO PLAY</span>")
          s = s.replace("data-action=\"settings\">⚙ RULES", "data-action=\"info\">? HOW TO PLAY")
          s = s.replace("data-action=\"settings\">⚙ HOW TO PLAY", "data-action=\"info\">? HOW TO PLAY")

          if "if (action === 'info')" not in s:
            s = s.replace(
              "    if (action === 'settings') { showHowToPlay(); return; }",
              "    if (action === 'info') { showHowToPlay(); return; }\n    if (action === 'back-from-info') { state.screen = state.helpReturn || 'home'; render(); return; }\n    if (action === 'settings') { showHowToPlay(); return; }"
            )
          else:
            if "back-from-info" not in s:
              s = s.replace(
                "    if (action === 'info') { showHowToPlay(); return; }",
                "    if (action === 'info') { showHowToPlay(); return; }\n    if (action === 'back-from-info') { state.screen = state.helpReturn || 'home'; render(); return; }"
              )

          # Force Android/browser back behavior for the in-app info screen.
          if "state.screen === 'info'" not in s:
            s = s.replace(
              "    if (state.screen === 'help') {\n      state.screen = state.helpReturn || 'home'; render(); return true;\n    }",
              "    if (state.screen === 'help') {\n      state.screen = state.helpReturn || 'home'; render(); return true;\n    }\n    if (state.screen === 'info') {\n      state.screen = state.helpReturn || 'home'; render(); return true;\n    }"
            )

          # The browser-native alert must never be used in this app.
          s = re.sub(r"\balert\([^;]*\);", "showHowToPlay();", s)

          p.write_text(s)

          css = Path('web/styles.css')
          c = css.read_text()
          c += """
          
          /* Retro comic brand + internal help screen */
          .retro-logo {
            line-height:.8;
            transform:rotate(-2deg);
            display:grid;
            place-items:center;
            align-content:center;
          }
          .retro-logo .retro-word {
            display:block;
            color:var(--red);
            font-family:"Arial Black",Impact,system-ui,sans-serif;
            font-size:clamp(27px,8vw,35px);
            letter-spacing:-1.5px;
            -webkit-text-stroke:1.5px var(--ink);
            text-shadow:2px 2px 0 var(--cream);
          }
          .retro-logo .slide-word {
            display:block;
            margin-top:2px;
            color:var(--blue);
            font-family:"Arial Black",Impact,system-ui,sans-serif;
            font-size:clamp(15px,4.8vw,21px);
            letter-spacing:1.4px;
            -webkit-text-stroke:1.2px var(--ink);
            text-shadow:1.5px 1.5px 0 var(--cream);
          }
          .info-screen { padding-bottom:calc(22px + env(safe-area-inset-bottom)); }
          .rules-grid { display:grid; gap:9px; margin-top:8px; }
          .rule-card { display:grid; grid-template-columns:42px 1fr; gap:10px; align-items:center; padding:11px; border:2.5px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); }
          .rule-card.blue { background:var(--blue); }
          .rule-card.salmon { background:var(--salmon); }
          .rule-card.green { background:var(--green); }
          .rule-card > b { width:38px; height:38px; display:grid; place-items:center; border:2px solid var(--ink); border-radius:50%; background:var(--ink); color:var(--yellow2); font-family:"Arial Black",system-ui,sans-serif; font-size:16px; }
          .rule-card h3 { margin:0 0 3px; font-family:"Arial Black",system-ui,sans-serif; font-size:12px; }
          .rule-card p { margin:0; font-size:9px; line-height:1.35; font-weight:750; }
          .rule-tools { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:10px 0; }
          .rule-tools span { padding:9px; border:2px solid var(--ink); border-radius:10px; background:rgba(255,255,255,.46); font-size:8px; font-weight:800; }
          .rule-tools strong { display:block; margin-bottom:1px; font-size:8px; }
          """
          css.write_text(c)

          if "alert(" in s:
            raise SystemExit("Browser alert still present in app.js")
          PY

          node --check web/app.js

      - name: Install asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar webp

      - name: Build optimized static assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://retro-slide-y74fj6.v2.appdeploy.ai/resources'
          PUZZLES='web/assets/puzzles'
          THUMBS='web/assets/thumbs'
          mkdir -p "$PUZZLES" "$THUMBS" /tmp/packs

          convert_one() {
            cwebp -quiet -q 80 -resize 768 768 "$1" -o "$PUZZLES/$2.webp"
            cwebp -quiet -q 68 -resize 192 192 "$1" -o "$THUMBS/$2.webp"
          }

          declare -A O=(
            [hero]='puzzle-1.png' [monster]='puzzle-2.png' [rocket]='puzzle-3.png'
            [tiger]='new-tiger.png' [pirate]='new-pirate.png' [robot]='new-robot.png'
            [pharaoh]='new-pharaoh.png' [trex]='new-trex.png' [neon]='new-neon-car.png'
            [submarine]='new-submarine.png' [dragon]='new-dragon.png'
            [astronaut]='new-astronaut.png' [polar]='new-polar.png'
          )

          for id in "${!O[@]}"; do
            f="/tmp/packs/${O[$id]}"
            curl --retry 4 --retry-delay 2 -fsSL "$BASE/${O[$id]}" -o "$f"
            convert_one "$f" "$id"
          done

          pack() {
            remote="$1"
            prefix="$2"
            rar="/tmp/packs/$prefix.rar"
            dir="/tmp/packs/$prefix"
            mkdir -p "$dir"
            curl --retry 4 --retry-delay 2 -fsSL "$BASE/$remote" -o "$rar"
            unar -q -f -o "$dir" "$rar" >/dev/null
            mapfile -d '' files < <(find "$dir" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | sort -zV)
            test "${#files[@]}" -eq 10
            for i in "${!files[@]}"; do
              n=$((i+1))
              id=$(printf '%s-%02d' "$prefix" "$n")
              convert_one "${files[$i]}" "$id"
            done
          }

          pack 'japan-sildes.rar' japan
          pack 'lord-of-rings-slides.rar' fantasy
          pack 'horror-slides.rar' horror
          test "$(find "$PUZZLES" -name '*.webp' | wc -l)" -eq 43
          test "$(find "$THUMBS" -name '*.webp' | wc -l)" -eq 43
          du -sh web/assets

