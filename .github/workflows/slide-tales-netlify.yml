          .card:nth-child(4n+2) { transform:rotate(.16deg); }
          .card:nth-child(4n+3) { transform:rotate(.2deg); }
          .card:nth-child(4n) { transform:rotate(-.14deg); }
          .card:active { transform:translateY(2px) scale(.986) rotate(0deg); }
          .card-art { background:#d8cfaf; }
          .card-art img {
            transition:transform .28s var(--ease-pop), filter .2s ease, opacity .18s ease;
            backface-visibility:hidden;
          }
          .card:active .card-art img { transform:scale(1.025); }
          .card > strong { font-size:12.5px; letter-spacing:-.05px; }
          .card-chip { background:rgba(235,143,127,.94); }
          .grid-chip { background:rgba(255,226,122,.96); }

          .game-head .mini {
            background:rgba(246,231,196,.68);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
          }
          .now-playing strong { letter-spacing:-.2px; }
          .board-frame {
            box-shadow:0 4px 0 var(--ink), 0 13px 26px rgba(60,39,15,.14);
            background:linear-gradient(145deg,#fff0ce,var(--cream));
          }
          .board-frame::before {
            content:"";
            position:absolute;
            inset:3px;
            border:1px solid rgba(255,255,255,.48);
            border-radius:12px;
            pointer-events:none;
            z-index:1;
          }
          .board { box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
          .tile {
            transition:filter .12s ease, opacity .12s ease;
            backface-visibility:hidden;
            transform:translateZ(0);
          }
          .tile.empty {
            background:
              repeating-linear-gradient(135deg,#2b2c2e 0 5px,#252629 5px 10px);
          }
          .control { box-shadow:0 3px 0 var(--ink); }
          .control span { letter-spacing:.35px; }
          .progress {
            border:1px solid rgba(255,255,255,.08);
            box-shadow:0 2px 0 rgba(0,0,0,.18);
          }

          .overlay {
            border:1px solid rgba(246,231,196,.25);
            background:linear-gradient(155deg,rgba(23,23,24,.985),rgba(39,36,36,.985));
            box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
            animation:overlaySoftIn .18s var(--ease-pop) both;
          }
          @keyframes overlaySoftIn {
            from { opacity:0; transform:scale(.975) translateY(4px); }
            to { opacity:1; transform:scale(1) translateY(0); }
          }
          .quick-step {
            transition:transform .16s var(--ease-pop), background-color .16s ease;
          }
          .quick-step:nth-child(odd) { transform:rotate(-.12deg); }
          .quick-step:nth-child(even) { transform:rotate(.12deg); }

          .help-intro {
            background:linear-gradient(145deg,var(--ink),#2b2928);
            box-shadow:0 3px 0 rgba(0,0,0,.18);
          }
          .help-card {
            background:rgba(246,231,196,.82);
            box-shadow:0 3px 0 var(--ink);
            animation:guideCardIn .22s var(--ease-pop) both;
          }
          .help-card:nth-of-type(2) { animation-delay:.025s; }
          .help-card:nth-of-type(3) { animation-delay:.05s; }
          .help-card:nth-of-type(4) { animation-delay:.075s; }
          @keyframes guideCardIn {
            from { opacity:0; transform:translateY(7px); }
            to { opacity:1; transform:translateY(0); }
          }

          .rule-card {
            box-shadow:0 3px 0 var(--ink), 0 7px 16px rgba(61,40,16,.08);
          }
          .rule-card:nth-child(1) { transform:rotate(-.16deg); }
          .rule-card:nth-child(2) { transform:rotate(.12deg); }
          .rule-card:nth-child(3) { transform:rotate(-.08deg); }

