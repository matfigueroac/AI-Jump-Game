      - name: Stabilize interaction router
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/handle.txt
          echo '' | base64 -d > /tmp/guide.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('web/app.js')
          s = p.read_text()

          if "function handle(action, element)" not in s:
              handle = Path('/tmp/handle.txt').read_text()
              marker = "  document.addEventListener('click', event => {"
              if marker not in s:
                  raise SystemExit("Click listener marker missing")
              s = s.replace(marker, handle + marker, 1)

          start = s.find("    if (state.guide) {")
          if start >= 0:
              ret = s.find("\n    return '';", start)
              if ret < 0:
                  raise SystemExit("Guide return marker missing")
              guide = Path('/tmp/guide.txt').read_text().rstrip()
              s = s[:start] + guide + s[ret:]

          p.write_text(s)
          PY
          node --check web/app.js
          grep -q "function handle(action, element)" web/app.js
          grep -q "QUICK GUIDE" web/app.js
          if grep -q "ORIGINAL IMAGE" web/app.js; then
            echo "Old image-based guide still present" >&2
            exit 1
          fi

      - name: Make puzzle images instant on play
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('web/app.js')
          s = p.read_text()

          helpers = """  function boardImageSrc(id) {
            const full = puzzleSrc(id);
            return warmedImages.has(full) ? full : thumbSrc(id);
          }

          function upgradeBoardImage(id) {
            const full = puzzleSrc(id);
            document.querySelectorAll('.tile[data-value]').forEach(tile => {
              tile.style.backgroundImage = 'url("' + full + '")';
              tile.classList.add('image-ready');
            });
          }

          function warmPuzzleSet(filter) {
            const items = filterPuzzles(filter).slice(0, filter === 'all' ? 6 : 10);
            const run = async () => {
              for (let i = 0; i < items.length; i += 2) {
                await Promise.all(items.slice(i, i + 2).map(p => preloadPuzzle(p.id)));
                await new Promise(resolve => setTimeout(resolve, 45));
              }
            };
            if ('requestIdleCallback' in window) requestIdleCallback(() => run(), { timeout: 500 });
            else setTimeout(run, 120);
          }

          """
          if "function boardImageSrc(id)" not in s:
            marker = "  function tileMarkup(value, index) {"
            if marker not in s:
              raise SystemExit("tileMarkup marker missing")
            s = s.replace(marker, helpers + marker, 1)

          start = s.find("  function tileMarkup(value, index) {")
          end = s.find("\n  function gameOverlay()", start)
          if start < 0 or end < 0:
            raise SystemExit("tileMarkup block not found")
          tile_block = s[start:end]
          if "boardImageSrc(state.current.id)" not in tile_block:
            tile_block = tile_block.replace("puzzleSrc(state.current.id)", "boardImageSrc(state.current.id)", 1)
          s = s[:start] + tile_block + s[end:]

          start = s.find("  function startRound(")
          end = s.find("\n  function resetRound", start)
          if start < 0 or end < 0:
            raise SystemExit("startRound block not found")
          round_block = s[start:end]
          old = round_block
          round_block = re.sub(
            r"preloadPuzzle\(puzzle\.id\);\s*render\(\);",
            """preloadImage(thumbSrc(puzzle.id), 'high');
            render();
            preloadPuzzle(puzzle.id).then(() => {
              if (state.screen === 'game' && state.current.id === puzzle.id) {
                upgradeBoardImage(puzzle.id);
              }
            });""",
            round_block,
            count=1
          )
          if round_block == old:
            raise SystemExit("startRound preload pattern not found")
          s = s[:start] + round_block + s[end:]

          # Start warming high-resolution art when a collection is selected.
          s = s.replace(
            "    warmFilter(state.filter);\n    const tabs = document.querySelector('.collection-tabs');",
            "    warmFilter(state.filter);\n    warmPuzzleSet(state.filter);\n    const tabs = document.querySelector('.collection-tabs');"
          )

          # Warm the current collection shortly after initial render.
          if "warmPuzzleSet(state.filter);" not in s.split("window.handleAndroidBack")[1]:
            s = s.replace(
              "  warmFilter(state.filter);\n  warmAllCollections();",
              "  warmFilter(state.filter);\n  warmPuzzleSet(state.filter);\n  warmAllCollections();"
            )

          # Mobile tap starts the full image request before the click opens the puzzle.
          if "prewarm-card-image" not in s:
            listener = """  // prewarm-card-image
          document.addEventListener('pointerdown', event => {
            const card = event.target.closest('.card[data-id]');
            if (card) preloadPuzzle(card.dataset.id);
          }, { passive: true });

          """
            marker = "  document.addEventListener('click', event => {"
            if marker not in s:
              raise SystemExit("click listener marker missing")
            s = s.replace(marker, listener + marker, 1)

          p.write_text(s)
          PY

          cat >> web/styles.css <<'CSS'

          /* Instant puzzle handoff: cached thumbnail first, decoded full image second */
          .tile {
            background-color: #263139;
            transition: filter .12s ease, opacity .12s ease;
          }
          .tile.image-ready {
            animation: tileImageReady .14s ease-out both;
          }
          @keyframes tileImageReady {
            from { filter: saturate(.9) brightness(.96); }
            to { filter: saturate(1) brightness(1); }
          }
          CSS

          node --check web/app.js
          grep -q "function boardImageSrc(id)" web/app.js
          grep -q "function warmPuzzleSet(filter)" web/app.js
          grep -q "prewarm-card-image" web/app.js

      - name: Retro Smooth UI audit pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('web/app.js')
          s = app.read_text()

          # Give the daily artwork context without adding another button or paragraph.
          s = s.replace(
