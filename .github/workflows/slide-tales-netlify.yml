      - name: Version shell assets to bypass old service workers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          version = 'comic-v12'
          app = Path('web/app.js')
          css = Path('web/styles.css')
          index = Path('web/index.html')
          sw = Path('web/sw.js')
          headers = Path('web/_headers')

          app_v = Path(f'web/app-{version}.js')
          css_v = Path(f'web/styles-{version}.css')
          logo_src = Path('web/assets/ui/retro-slide-tales-logo.webp')
          logo_v = Path(f'web/assets/ui/retro-slide-tales-logo-{version}.webp')

          app_v.write_bytes(app.read_bytes())
          css_v.write_bytes(css.read_bytes())
          logo_v.write_bytes(logo_src.read_bytes())

          h = index.read_text()
          h = h.replace('./styles.css', f'./styles-{version}.css')
          h = h.replace('./app.js', f'./app-{version}.js')
          if 'slide-tales-ui-version' not in h:
              h = h.replace('<meta name="theme-color" content="#F2C84B" />',
                            '<meta name="theme-color" content="#F2C84B" />\n  <meta name="slide-tales-ui-version" content="comic-v12" />')
          index.write_text(h)

          # Point the logo to the versioned file in the versioned app bundle.
          s = app_v.read_text().replace('./assets/ui/retro-slide-tales-logo.webp',
                                        f'./assets/ui/retro-slide-tales-logo-{version}.webp')
          s = re.sub(
              r"\n  if \('serviceWorker' in navigator && \(location\.protocol === 'https:' \|\| location\.hostname === 'localhost'\)\) \{\n    navigator\.serviceWorker\.register\('\./sw\.js'\)\.catch\(\(\) => \{\}\);\n  \}\n",
              "\n",
              s,
              count=1
          )
          app_v.write_text(s)

          h = index.read_text()
          cleanup = "  <script>\n    if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(() => {}); }\n    if ('caches' in window) { caches.keys().then(keys => Promise.all(keys.filter(k => k.startsWith('slide-tales-shell-')).map(k => caches.delete(k)))).catch(() => {}); }\n  </script>\n"
          h = h.replace('  <script src="./app-comic-v12.js"></script>', cleanup + '  <script src="./app-comic-v12.js"></script>')
          index.write_text(h)

          if sw.exists():
              x = sw.read_text()
              x = re.sub(r"const SHELL_CACHE='[^']+';", "const SHELL_CACHE='slide-tales-shell-v12';", x, count=1)
              x = re.sub(
                  r"const SHELL=\[[^;]+\];",
                  "const SHELL=['./','./index.html','./styles-comic-v12.css','./app-comic-v12.js','./assets/ui/retro-slide-tales-logo-comic-v12.webp'];",
                  x,
                  count=1
              )
              sw.write_text(x)

          hdr = headers.read_text() if headers.exists() else ''
          hdr += "\n/app-comic-v12.js\n  Cache-Control: public, max-age=31536000, immutable\n\n/styles-comic-v12.css\n  Cache-Control: public, max-age=31536000, immutable\n\n/assets/ui/retro-slide-tales-logo-comic-v12.webp\n  Cache-Control: public, max-age=31536000, immutable\n\n/\n  Cache-Control: no-cache, no-store, must-revalidate\n"
          headers.write_text(hdr)
          PY

          node --check web/app-comic-v12.js
          cp slide-tales-ui/smoke-v12.js /tmp/smoke-v12-versioned.js
          sed -i "s#web/app.js#web/app-comic-v12.js#g" /tmp/smoke-v12-versioned.js
          node /tmp/smoke-v12-versioned.js

          grep -q 'styles-comic-v12.css' web/index.html
          grep -q 'app-comic-v12.js' web/index.html
          grep -q 'slide-tales-ui-version' web/index.html
          test -s web/assets/ui/retro-slide-tales-logo-comic-v12.webp

      - name: Upload Comic v12 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: slide-tales-comic-v12-web
          path: web
          retention-days: 1

      - name: Install asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar webp

      - name: Build optimized static assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://retro-slide-y74fj6.v2.appdeploy.ai/resources'
          PUZZLES='web/assets/puzzles'
          THUMBS='web/assets/thumbs'
          mkdir -p "$PUZZLES" "$THUMBS" /tmp/packs

          convert_one() {
            cwebp -quiet -q 78 -resize 640 640 "$1" -o "$PUZZLES/$2.webp"
            cwebp -quiet -q 68 -resize 192 192 "$1" -o "$THUMBS/$2.webp"
          }

          declare -A O=(
            [hero]='puzzle-1.png' [monster]='puzzle-2.png' [rocket]='puzzle-3.png'
            [tiger]='new-tiger.png' [pirate]='new-pirate.png' [robot]='new-robot.png'
            [pharaoh]='new-pharaoh.png' [trex]='new-trex.png' [neon]='new-neon-car.png'
            [submarine]='new-submarine.png' [dragon]='new-dragon.png'
            [astronaut]='new-astronaut.png' [polar]='new-polar.png'
          )

          for id in "${!O[@]}"; do
            f="/tmp/packs/${O[$id]}"
            curl --retry 4 --retry-delay 2 -fsSL "$BASE/${O[$id]}" -o "$f"
            convert_one "$f" "$id"
          done

          pack() {
            remote="$1"
            prefix="$2"
            rar="/tmp/packs/$prefix.rar"
            dir="/tmp/packs/$prefix"
            mkdir -p "$dir"
            curl --retry 4 --retry-delay 2 -fsSL "$BASE/$remote" -o "$rar"
            unar -q -f -o "$dir" "$rar" >/dev/null
            mapfile -d '' files < <(find "$dir" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | sort -zV)
            test "${#files[@]}" -eq 10
            for i in "${!files[@]}"; do
              n=$((i+1))
              id=$(printf '%s-%02d' "$prefix" "$n")
              convert_one "${files[$i]}" "$id"
            done
          }

          pack 'japan-sildes.rar' japan
          pack 'lord-of-rings-slides.rar' fantasy
          pack 'horror-slides.rar' horror
          test "$(find "$PUZZLES" -name '*.webp' | wc -l)" -eq 43
          test "$(find "$THUMBS" -name '*.webp' | wc -l)" -eq 43
          du -sh web/assets

