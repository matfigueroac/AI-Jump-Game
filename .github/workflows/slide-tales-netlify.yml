            .card > strong { font-size:12px; }
          }

          @media (hover:hover) and (pointer:fine) {
            .card:hover { transform:translateY(-2px) rotate(0deg); filter:brightness(1.015); }
            .action:hover,.level-button:hover,.collection-tab:hover { filter:brightness(1.025); }
          }

          @media (prefers-reduced-motion:reduce) {
            .retro-logo,.home-screen,.collection-screen,.help-screen,.info-screen,.howto-screen,
            .preview,.help-card,.overlay { animation:none !important; }
          }
