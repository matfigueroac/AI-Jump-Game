          )

          # Ordinary tile moves update only the board and move count.
          # This avoids rebuilding the complete game screen on every tap.
          if 'function refreshGameBoard()' not in s:
            helper = """  function refreshGameBoard() {
              if (state.screen !== 'game' || state.won || state.paused || state.guide || state.hint) {
                render();
                return;
              }
              const board = document.querySelector('.board');
              if (!board) {
                render();
                return;
              }
              board.innerHTML = state.board.map(tileMarkup).join('');
              const stats = document.querySelectorAll('.game-head .mini b');
              if (stats[0]) stats[0].textContent = String(state.moves);
            }

          """
            marker = "  function moveTile(index) {"
