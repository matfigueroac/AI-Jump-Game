name: Deploy Slide Tales to Netlify

on:
  push:
    branches:
      - slide-tales-android-build
    paths:
      - '.github/workflows/slide-tales-netlify.yml'
      - 'slide-tales-src.tgz'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare web source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web /tmp/slidetales-src
          mkdir -p web /tmp/slidetales-src
          tar -xzf slide-tales-src.tgz -C /tmp/slidetales-src
          cp -R /tmp/slidetales-src/app/src/main/assets/www/. web/

      - name: Validate interaction code
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          grep -q "function handle(action, element)" web/app.js
          grep -q "QUICK GUIDE" web/app.js
          if grep -q "ORIGINAL IMAGE" web/app.js; then
            echo "Old image-based GUIDE still present" >&2
            exit 1
          fi
          if grep -q "alert(" web/app.js; then
            echo "Browser alert still present" >&2
            exit 1
          fi

      - name: Install asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar webp

      - name: Build optimized static assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://retro-slide-y74fj6.v2.appdeploy.ai/resources'
          PUZZLES='web/assets/puzzles'
          THUMBS='web/assets/thumbs'
          mkdir -p "$PUZZLES" "$THUMBS" /tmp/packs

          convert_one() {
            cwebp -quiet -q 80 -resize 768 768 "$1" -o "$PUZZLES/$2.webp"
            cwebp -quiet -q 68 -resize 192 192 "$1" -o "$THUMBS/$2.webp"
          }

          declare -A O=(
            [hero]='puzzle-1.png' [monster]='puzzle-2.png' [rocket]='puzzle-3.png'
            [tiger]='new-tiger.png' [pirate]='new-pirate.png' [robot]='new-robot.png'
            [pharaoh]='new-pharaoh.png' [trex]='new-trex.png' [neon]='new-neon-car.png'
            [submarine]='new-submarine.png' [dragon]='new-dragon.png'
            [astronaut]='new-astronaut.png' [polar]='new-polar.png'
          )

          for id in "${!O[@]}"; do
            f="/tmp/packs/${O[$id]}"
            curl --retry 4 --retry-delay 2 -fsSL "$BASE/${O[$id]}" -o "$f"
            convert_one "$f" "$id"
          done

          pack() {
            remote="$1"
            prefix="$2"
            rar="/tmp/packs/$prefix.rar"
            dir="/tmp/packs/$prefix"
            mkdir -p "$dir"
            curl --retry 4 --retry-delay 2 -fsSL "$BASE/$remote" -o "$rar"
            unar -q -f -o "$dir" "$rar" >/dev/null
            mapfile -d '' files < <(find "$dir" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | sort -zV)
            test "${#files[@]}" -eq 10
            for i in "${!files[@]}"; do
              n=$((i+1))
              id=$(printf '%s-%02d' "$prefix" "$n")
              convert_one "${files[$i]}" "$id"
            done
          }

          pack 'japan-sildes.rar' japan
          pack 'lord-of-rings-slides.rar' fantasy
          pack 'horror-slides.rar' horror

          test "$(find "$PUZZLES" -name '*.webp' | wc -l)" -eq 43
          test "$(find "$THUMBS" -name '*.webp' | wc -l)" -eq 43

      - name: Deploy static site to Netlify
        working-directory: web
        run: |
          npx -y @netlify/mcp@latest --site-id ae95bf36-a8d3-4124-9791-261953c90c18 --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..S01LJb1TjndD8kXZ.jXa3tJsqFLx1Q59QnwmEezIRufdnLGy3sPmUAGUrEyJ-n2UobF433qP7W0ojxe9OnjNUI81h1gJ9NLMrkjFLS63vUAnHoNtKm_fuZ2w8BRgz9rhVLYZee-ymRLjWrDXX-6P8reayRcQby9KR22m-re8jXH3-ToZz6XHwm7dj9lh40W1MJHg8XxqZWYZhVBCujKatfZ0X8LoXYRm4RIYk3uZ9EAs6ea7ivxOzM2ElOuV9w8Vt1Y3-bCjeyrogqvH-O651YbBsZzl6jNtLJmlIpgflOrWumuNqKwnLQXBnyS-llIRy0Ezs_cxvxhbgrhXJTvBlkNqyOuDC553v91VLr4UPBnG_-NwT_MvcKJ7AyVdUO-wj9xrLuXqD_8qiL5iR0FCQHiFi.V6-rF5dtDKbvJjmYTqfs8Q" --no-wait
