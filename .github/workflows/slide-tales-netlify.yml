name: Deploy Slide Tales to Netlify

on:
  push:
    branches:
      - slide-tales-android-build
    paths:
      - '.github/workflows/slide-tales-netlify.yml'
      - 'slide-tales-web-v4.tgz'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare clean web source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web
          mkdir -p web
          tar -xzf slide-tales-web-v4.tgz -C web
          node --check web/app.js
          grep -q "function handle(action, element)" web/app.js
          grep -q "function setupCardPrefetch()" web/app.js
          if grep -q "alert(" web/app.js; then
            echo "Native browser alert found" >&2
            exit 1
          fi
          if grep -q "ORIGINAL IMAGE" web/app.js; then
            echo "Old image-based guide found" >&2
            exit 1
          fi

      - name: Install asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unar webp

      - name: Build optimized puzzle assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://retro-slide-y74fj6.v2.appdeploy.ai/resources'
          PUZZLES='web/assets/puzzles'
          THUMBS='web/assets/thumbs'
          mkdir -p "$PUZZLES" "$THUMBS" /tmp/packs

          convert_one() {
            cwebp -quiet -q 78 -resize 640 640 "$1" -o "$PUZZLES/$2.webp"
            cwebp -quiet -q 68 -resize 192 192 "$1" -o "$THUMBS/$2.webp"
          }

          declare -A O=(
            [hero]='puzzle-1.png' [monster]='puzzle-2.png' [rocket]='puzzle-3.png'
            [tiger]='new-tiger.png' [pirate]='new-pirate.png' [robot]='new-robot.png'
            [pharaoh]='new-pharaoh.png' [trex]='new-trex.png' [neon]='new-neon-car.png'
            [submarine]='new-submarine.png' [dragon]='new-dragon.png'
            [astronaut]='new-astronaut.png' [polar]='new-polar.png'
          )

          for id in "${!O[@]}"; do
            f="/tmp/packs/${O[$id]}"
            curl --retry 4 --retry-delay 2 -fsSL "$BASE/${O[$id]}" -o "$f"
            convert_one "$f" "$id"
          done

          pack() {
            remote="$1"
            prefix="$2"
            rar="/tmp/packs/$prefix.rar"
            dir="/tmp/packs/$prefix"
            mkdir -p "$dir"
            curl --retry 4 --retry-delay 2 -fsSL "$BASE/$remote" -o "$rar"
            unar -q -f -o "$dir" "$rar" >/dev/null
            mapfile -d '' files < <(find "$dir" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | sort -zV)
            test "${#files[@]}" -eq 10
            for i in "${!files[@]}"; do
              n=$((i+1))
              id=$(printf '%s-%02d' "$prefix" "$n")
              convert_one "${files[$i]}" "$id"
            done
          }

          pack 'japan-sildes.rar' japan
          pack 'lord-of-rings-slides.rar' fantasy
          pack 'horror-slides.rar' horror

          test "$(find "$PUZZLES" -name '*.webp' | wc -l)" -eq 43
          test "$(find "$THUMBS" -name '*.webp' | wc -l)" -eq 43
          du -sh web/assets

      - name: Deploy static site to Netlify
        working-directory: web
        run: |
          npx -y @netlify/mcp@latest --site-id ae95bf36-a8d3-4124-9791-261953c90c18 --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..uDgkEFtVbEDDYZaH.MKSj1eZ3KYYACoHdGyQF2SNe3zbEmU8SMxdho4veCbo6e5yLiln8PolIwsjQWANw1hlFWnTz4GCxL_LboXl6TgccTh-OM24Kh8m8e68CHHKgWuWNDt1Yz6CVLa6wqozovNS_Hh06-KBMqkHOZoZupcQQgZ4Oe-y-z6uw7C5E00Qr2XpTsO5EdLRkxvNg1O_fGXeYJE1--pvmErKPRQGlLoqttGraMT3o2e4xguRzLV8IxCp2H4ys5v1KimVUH7Kb1dvl8Ter0aRTHN8T_7yK1KqcSu3SYhECEQ-p1TQNE3NgRt6yJMl7QIgHTnOoeOz5hqTpfR51nvecaChkjtXTpx8ATpFiLqmEJQsWY80JkV-g0zlh9_3LQdcJODIjSMqzrUPP12i9.8Mpj9O7Gw3vmdvh3dB2kSA" --no-wait
