name: Deploy Slide Tales to Netlify

on:
  push:
    branches:
      - slide-tales-android-build
    paths:
      - '.github/workflows/slide-tales-netlify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare web source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web /tmp/slidetales-src
          mkdir -p web /tmp/slidetales-src
          tar -xzf slide-tales-src.tgz -C /tmp/slidetales-src
          cp -R /tmp/slidetales-src/app/src/main/assets/www/. web/

      - name: Apply mobile UI v2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('web/app.js')
          s = p.read_text()

          s = s.replace("{ id: 'japan', label: 'SAMURAI & JAPAN', count: 10 }", "{ id: 'japan', label: 'JAPAN', count: 10 }")
          s = s.replace("{ id: 'fantasy', label: 'EPIC FANTASY', count: 10 }", "{ id: 'fantasy', label: 'FANTASY', count: 10 }")
          s = s.replace("{ id: 'horror', label: 'RETRO HORROR', count: 10 }", "{ id: 'horror', label: 'HORROR', count: 10 }")
          s = s.replace("  const app = document.getElementById('app');", "  const ASSET_VERSION = 'ui-2026-09-30-2';\n  const warmedImages = new Set();\n\n  const app = document.getElementById('app');")
          s = s.replace("  function puzzleSrc(id) { return './assets/puzzles/' + id + '.webp'; }\n  function thumbSrc(id) { return './assets/thumbs/' + id + '.webp'; }", "  function puzzleSrc(id) { return './assets/puzzles/' + id + '.webp?v=' + ASSET_VERSION; }\n  function thumbSrc(id) { return './assets/thumbs/' + id + '.webp?v=' + ASSET_VERSION; }")
          s = s.replace("    won: false,\n    records: loadJson(recordsKey, {}),", "    won: false,\n    helpReturn: 'home',\n    infoReturn: 'home',\n    records: loadJson(recordsKey, {}),")

          home = '''  function dailyPuzzle() {
            const now = new Date();
            const key = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + '-slide-tales';
            let hash = 2166136261;
            for (let i = 0; i < key.length; i += 1) {
              hash ^= key.charCodeAt(i);
              hash = Math.imul(hash, 16777619);
            }
            hash ^= hash >>> 16;
            hash = Math.imul(hash, 2246822507);
            hash ^= hash >>> 13;
            return PUZZLES[(hash >>> 0) % PUZZLES.length];
          }

          function renderHome() {
            const featured = dailyPuzzle();
            return shell('<section class="screen home-screen">' +
              '<div class="hero-lockup"><p class="hero-copy">PICK · SLIDE · SOLVE</p><p class="hero-sub">One fresh pick every day.</p></div>' +
              levelSelector() +
              '<div class="preview"><img fetchpriority="high" decoding="async" src="' + puzzleSrc(featured.id) + '" alt="' + featured.title + '">' + previewGrid() + '<span class="preview-chip">' + state.size + '×' + state.size + '</span></div>' +
              '<button class="action red play" data-action="daily">▶ PLAY DAILY PICK</button>' +
              '<div class="home-actions">' +
                '<button class="action blue" data-action="collection">▦<span>COLLECTIONS</span></button>' +
                '<button class="action green" data-action="settings">?<span>HOW TO PLAY</span></button>' +
              '</div>' +
              '<div class="home-secondary single">' +
                '<button class="action salmon" data-action="help">★ LEARN THE 4×4</button>' +
              '</div>' +
            '</section>');
          }'''
          s = re.sub(r"  function renderHome\(\) \{.*?\n  \}\n\n  function collectionProgress", home + "\n\n  function collectionProgress", s, count=1, flags=re.S)

          collection = '''  function collectionCardsMarkup() {
            const list = state.filter === 'all' ? PUZZLES : PUZZLES.filter(p => p.collection === state.filter);
            return list.map(p => {
              const record = state.records[recordKey(p.id, state.size)];
              const collectionLabel = COLLECTIONS.find(c => c.id === p.collection)?.label || p.category;
              return '<button class="card" data-action="play" data-id="' + p.id + '">' +
                '<div class="card-art"><img loading="lazy" decoding="async" fetchpriority="low" width="192" height="192" src="' + thumbSrc(p.id) + '" alt="' + p.title + '"><span class="card-chip">' + collectionLabel + '</span><span class="grid-chip">' + state.size + '×' + state.size + '</span></div>' +
                '<strong>' + p.title + '</strong>' +
                '<div class="card-footer"><div class="card-stars">' + starMarkup(record?.stars || 0) + '</div><small>' + (record ? record.moves + ' moves' : 'NEW') + '</small></div>' +
              '</button>';
            }).join('');
          }

          function collectionTabsMarkup() {
            return COLLECTIONS.map(c => '<button class="collection-tab ' + (state.filter === c.id ? 'active' : '') + '" data-action="filter" data-filter="' + c.id + '"><strong>' + c.label + '</strong><small>' + c.count + '</small></button>').join('');
          }

          function renderCollection() {
            return shell('<section class="screen collection-screen">' +
              '<div class="title-row"><button class="back" data-action="home">←</button><div><h1>COLLECTIONS</h1><p>Pick a theme.</p></div></div>' +
              levelSelector() + '<div class="collection-tabs">' + collectionTabsMarkup() + '</div>' +
              '<div class="collection-summary"><b>' + state.size + '×' + state.size + '</b><span>' + collectionProgress(state.filter) + '</span></div>' +
              '<div class="cards">' + collectionCardsMarkup() + '</div>' +
              '<nav class="bottom-nav"><button data-action="home">⌂ HOME</button><button class="active" data-action="collection">▦ COLLECTIONS</button></nav>' +
            '</section>');
          }

          function updateCollectionFilter(filter) {
            state.filter = filter || 'all';
            savePrefs();
            warmFilter(state.filter);
            const tabs = document.querySelector('.collection-tabs');
            const cards = document.querySelector('.cards');
            const summary = document.querySelector('.collection-summary span');
            if (state.screen !== 'collection' || !tabs || !cards || !summary) return render();
            tabs.innerHTML = collectionTabsMarkup();
            summary.textContent = collectionProgress(state.filter);
            cards.classList.add('switching');
            requestAnimationFrame(() => {
              cards.innerHTML = collectionCardsMarkup();
              cards.classList.remove('switching');
            });
          }'''
          s = re.sub(r"  function renderCollection\(\) \{.*?\n  \}\n\n  function tileMarkup", collection + "\n\n  function tileMarkup", s, count=1, flags=re.S)

          old_guide = '''    if (state.guide) {
              return '<div class="overlay"><h2>ORIGINAL IMAGE</h2><img src="' + puzzleSrc(state.current.id) + '" alt="Original puzzle"><p>The timer is paused while the guide is open.</p><button class="action blue" data-action="close-guide">BACK TO PUZZLE</button></div>';
            }'''
          new_guide = '''    if (state.guide) {
              const steps = state.size === 4
                ? [
                    ['1', 'TOP ROW', 'Place 1–4. Stage the last two as a pair.'],
                    ['2', 'SECOND ROW', 'Place 5–8, then lock both finished rows.'],
                    ['3', 'VERTICAL PAIRS', 'Build 9+13, then 10+14 from left to right.'],
                    ['4', 'FINAL 2×2', 'Cycle 11, 12, 15 and the blank until solved.'],
                  ]
                : [
                    ['1', 'TOP ROW', 'Finish the top row first and stop moving through it.'],
                    ['2', 'LEFT SIDE', 'Place the next left tile and shrink the active area.'],
                    ['3', 'FINAL 2×2', 'Rotate the last four spaces until the image closes.'],
                  ];
              const items = steps.map(step => '<div class="quick-step"><b>' + step[0] + '</b><div><strong>' + step[1] + '</strong><span>' + step[2] + '</span></div></div>').join('');
              return '<div class="overlay guide-overlay"><div class="guide-kicker">QUICK GUIDE</div><h2>' + state.size + '×' + state.size + ' SOLVE PATH</h2><div class="quick-guide">' + items + '</div><div class="guide-tip">Keep solved zones locked. Move the blank only inside the active area.</div><div class="overlay-actions"><button class="action blue" data-action="close-guide">BACK</button>' + (state.size === 4 ? '<button class="action salmon" data-action="help">FULL GUIDE</button>' : '') + '</div></div>';
            }'''
          s = s.replace(old_guide, new_guide)

          s = s.replace('↝<span>SHUFFLE</span>', '↝<span>MIX</span>')
          s = s.replace('◉<span>GUIDE</span>', '☰<span>GUIDE</span>')
          s = s.replace('? HOW TO SOLVE THE 4x4', '? FULL 4×4 GUIDE')
          s = s.replace('<h1>SOLVE 4x4</h1><p>Layer + Pairs technique, made visual.</p>', '<h1>SOLVE 4×4</h1><p>Layer + Pairs.</p>')
          s = s.replace('<div class="help-intro"><h2>Think in locked zones</h2><p>Solve a band, stop moving through it, and keep shrinking the active area. Use the blank space as the tool that rotates pieces into position.</p></div>', '<div class="help-intro"><h2>Lock what you solve</h2><p>Finish one zone, stop moving through it, then shrink the active area.</p></div>')

          preload = '''  function preloadImage(src, priority = 'low') {
            if (warmedImages.has(src)) return Promise.resolve();
            return new Promise(resolve => {
              const image = new Image();
              image.decoding = 'async';
              try { image.fetchPriority = priority; } catch (_) {}
              const done = () => {
                warmedImages.add(src);
                if (image.decode) image.decode().catch(() => {}).finally(resolve);
                else resolve();
              };
              image.onload = done;
              image.onerror = resolve;
              image.src = src;
              if (image.complete) done();
            });
          }

          function preloadPuzzle(id) {
            return preloadImage(puzzleSrc(id), 'high');
          }

          function filterPuzzles(filter) {
            return filter === 'all' ? PUZZLES : PUZZLES.filter(p => p.collection === filter);
          }

          function warmFilter(filter) {
            const items = filterPuzzles(filter);
            const run = async () => {
              for (let i = 0; i < items.length; i += 4) {
                await Promise.all(items.slice(i, i + 4).map(p => preloadImage(thumbSrc(p.id))));
                await new Promise(resolve => setTimeout(resolve, 24));
              }
            };
            if ('requestIdleCallback' in window) requestIdleCallback(() => run(), { timeout: 900 });
            else setTimeout(run, 180);
          }

          function warmAllCollections() {
            const order = ['originals', 'japan', 'fantasy', 'horror'];
            let delay = 300;
            order.forEach(filter => {
              setTimeout(() => warmFilter(filter), delay);
              delay += 260;
            });
          }'''
          s = re.sub(r"  function preloadPuzzle\(id\) \{.*?\n  \}\n\n  function capturePositions", preload + "\n\n  function capturePositions", s, count=1, flags=re.S)

          s = re.sub(r"  function showHowToPlay\(\) \{.*?\n  \}", """  function showHowToPlay() {
            state.infoReturn = state.screen === 'game' ? 'game' : state.screen === 'collection' ? 'collection' : 'home';
            state.screen = 'howto';
            state.running = false;
            render();
          }""", s, count=1, flags=re.S)
          s = s.replace("    if (action === 'filter') {\n      state.filter = element.dataset.filter || 'all'; savePrefs(); render(); return;\n    }", "    if (action === 'filter') { updateCollectionFilter(element.dataset.filter || 'all'); return; }")
          s = s.replace("    if (action === 'help') { state.screen = 'help'; state.running = false; render(); return; }\n    if (action === 'back-from-help') { state.screen = 'home'; render(); return; }", "    if (action === 'help') { state.helpReturn = state.screen === 'game' ? 'game' : 'home'; state.guide = false; state.screen = 'help'; state.running = false; render(); return; }\n    if (action === 'back-from-help') { state.screen = state.helpReturn || 'home'; render(); return; }")
          s = s.replace("    if (state.screen === 'collection' || state.screen === 'help') {\n      state.screen = 'home'; render(); return true;\n    }", "    if (state.screen === 'collection') {\n      state.screen = 'home'; render(); return true;\n    }\n    if (state.screen === 'help') {\n      state.screen = state.helpReturn || 'home'; render(); return true;\n    }")
          howto = '''  function renderHowTo() {
            return shell('<section class="screen howto-screen">' +
              '<div class="title-row"><button class="back" data-action="back-from-howto">←</button><div><h1>HOW TO PLAY</h1><p>Three things to know.</p></div></div>' +
              '<div class="rules-grid">' +
                '<article class="rule-card blue"><b>1</b><div><h3>TAP IN LINE</h3><p>Tap a tile in the same row or column as the empty space.</p></div></article>' +
                '<article class="rule-card salmon"><b>2</b><div><h3>SLIDE THE STRIP</h3><p>Everything between your tile and the gap moves together.</p></div></article>' +
                '<article class="rule-card green"><b>3</b><div><h3>SOLVE SMART</h3><p>Hint shows the picture. Guide shows the solve path.</p></div></article>' +
              '</div>' +
              '<div class="rule-tools"><span><strong>HINT</strong> picture</span><span><strong>GUIDE</strong> steps</span><span><strong>MIX</strong> new shuffle</span><span><strong>RESET</strong> start over</span></div>' +
              '<button class="action black" data-action="back-from-howto">GOT IT</button>' +
            '</section>');
          }'''
          s = re.sub(r"  function render\(\) \{", howto + "\n\n  function render() {", s, count=1)
          s = s.replace("    else if (state.screen === 'game') app.innerHTML = renderGame();\n    else app.innerHTML = renderHelp();", "    else if (state.screen === 'game') app.innerHTML = renderGame();\n    else if (state.screen === 'help') app.innerHTML = renderHelp();\n    else app.innerHTML = renderHowTo();")
          s = s.replace("  preloadPuzzle(PUZZLES[0].id);\n  render();", "  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {\n    navigator.serviceWorker.register('./sw.js').catch(() => {});\n  }\n\n  preloadPuzzle(dailyPuzzle().id);\n  render();\n  warmFilter(state.filter);\n  warmAllCollections();")

          p.write_text(s)

          h = Path('web/index.html')
          hs = h.read_text()
          hs = hs.replace('#F3C623', '#F2C84B')
          hs = hs.replace('  <title>Slide Tales</title>', '  <meta name="mobile-web-app-capable" content="yes" />\n  <meta name="apple-mobile-web-app-capable" content="yes" />\n  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n  <meta name="description" content="Slide Tales - retro comic sliding puzzles made for touch." />\n  <title>Slide Tales</title>')
          h.write_text(hs)
          PY

          cat >> web/styles.css <<'CSS'

          /* Mobile UI v2 */
          :root {
            --yellow:#f2c84b; --yellow2:#ffe16a; --ink:#171718; --ink2:#2a2a2d;
            --red:#d94f45; --blue:#a9d6ea; --blue2:#5aadd0; --salmon:#ee8d7c;
            --cream:#f7e7c3; --green:#79b989; --purple:#8972c5; --white:#fff9ed;
          }
          .shell { width:min(100%,540px); background:radial-gradient(circle at 95% 8%,rgba(169,214,234,.44),transparent 24%),radial-gradient(circle at 5% 80%,rgba(238,141,124,.26),transparent 25%),linear-gradient(165deg,var(--yellow2),var(--yellow) 64%,#edb935); }
          .topbar { min-height:73px; padding:calc(9px + env(safe-area-inset-top)) 12px 5px; grid-template-columns:42px 1fr auto; }
          .icon-btn { width:42px; height:42px; border-width:2.5px; box-shadow:0 3px 0 var(--ink); }
          .logo { min-height:49px; font-family:"Arial Black",system-ui,sans-serif; transform:rotate(-1.5deg); }
          .logo .slide { font-size:clamp(31px,9vw,38px); -webkit-text-stroke:1.5px var(--ink); text-shadow:2px 2px 0 var(--cream); }
          .logo .tales { font-size:clamp(20px,6vw,25px); }
          .star-badge { min-width:52px; padding:7px 8px; border-width:2.5px; border-radius:12px; font-size:12px; box-shadow:0 3px 0 var(--ink); }
          .screen { padding:4px 11px calc(72px + env(safe-area-inset-bottom)); }
          .home-screen { padding-bottom:calc(18px + env(safe-area-inset-bottom)); }
          .hero-lockup { margin:2px 0 8px; text-align:center; }
          .hero-copy { margin:0; font-family:"Arial Black",system-ui,sans-serif; font-size:14px; letter-spacing:.55px; }
          .hero-sub { margin:2px 0 0; font-size:9px; font-weight:800; opacity:.66; }
          .level-selector { gap:8px; }
          .level-button { min-height:58px; padding:5px 8px; border-width:2.5px; border-radius:14px; box-shadow:0 4px 0 var(--ink); }
          .level-button strong { font-family:"Arial Black",system-ui,sans-serif; font-size:22px; }
          .level-button span { font-size:8px; } .level-button small { font-size:7px; }
          .preview { margin:11px auto 9px; width:min(78vw,326px); padding:6px; border-width:3px; border-radius:19px; box-shadow:0 5px 0 var(--ink); }
          .preview img,.preview-grid { border-radius:11px; } .preview-grid { inset:6px; }
          .preview-chip { right:11px; bottom:11px; font-size:11px; }
          .action { min-height:50px; border-width:2.5px; border-radius:13px; box-shadow:0 4px 0 var(--ink); transition:transform .12s ease,box-shadow .12s ease,filter .12s ease; }
          .action.play { font-family:"Arial Black",system-ui,sans-serif; font-size:17px; }
          .home-actions,.home-secondary { margin-top:8px; gap:8px; }
          .home-actions .action { min-height:56px; font-size:9px; } .home-secondary .action { min-height:42px; font-size:8px; }
          .home-secondary.single { grid-template-columns:1fr; }
          .howto-screen { padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
          .rules-grid { display:grid; gap:8px; margin-top:8px; }
          .rule-card { display:grid; grid-template-columns:40px 1fr; gap:9px; align-items:center; padding:10px; border:2.5px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); }
          .rule-card.blue { background:var(--blue); } .rule-card.salmon { background:var(--salmon); } .rule-card.green { background:var(--green); }
          .rule-card > b { width:36px; height:36px; display:grid; place-items:center; border:2px solid var(--ink); border-radius:50%; background:var(--ink); color:var(--yellow2); font-family:"Arial Black",system-ui,sans-serif; font-size:16px; }
          .rule-card h3 { margin:0 0 2px; font-family:"Arial Black",system-ui,sans-serif; font-size:12px; }
          .rule-card p { margin:0; font-size:9px; line-height:1.3; font-weight:750; }
          .rule-tools { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:9px 0; }
          .rule-tools span { padding:8px; border:2px solid var(--ink); border-radius:10px; background:rgba(255,255,255,.43); font-size:8px; font-weight:800; }
          .rule-tools strong { display:block; font-size:8px; }
          .title-row { grid-template-columns:41px 1fr; gap:8px; margin-bottom:8px; }
          .title-row h1 { font-family:"Arial Black",system-ui,sans-serif; font-size:25px; line-height:1; }
          .title-row p { font-size:8px; opacity:.68; }
          .back { width:39px; height:39px; border-width:2.5px; box-shadow:0 3px 0 var(--ink); }
          .collection-tabs { gap:7px; margin:8px -2px 6px; padding:2px 2px 6px; overscroll-behavior-x:contain; }
          .collection-tab { min-width:68px; min-height:43px; padding:6px 9px; border-width:2.5px; border-radius:12px; box-shadow:0 3px 0 var(--ink); transition:transform .12s ease,background .14s ease,color .14s ease; }
          .collection-tab strong { font-size:8px; } .collection-tab small { font-size:7px; }
          .collection-tab.active { transform:translateY(-1px); }
          .collection-summary { min-height:31px; margin:2px 0 8px; padding:6px 9px; border-radius:10px; }
          .collection-summary b { font-size:9px; } .collection-summary span { font-size:8px; }
          .cards { gap:8px; transition:opacity .12s ease,transform .12s ease; }
          .cards.switching { opacity:.55; transform:translateY(2px); }
          .card { padding:6px; border-width:2.5px; border-radius:13px; box-shadow:0 3px 0 var(--ink); content-visibility:auto; contain-intrinsic-size:205px; animation:cardIn .18s ease-out both; }
          @keyframes cardIn { from { opacity:0; transform:translateY(4px); } }
          .card-art { border-radius:9px; background:linear-gradient(135deg,rgba(169,214,234,.7),rgba(247,231,195,.8)); }
          .card-art::before { content:''; position:absolute; inset:0; background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.35) 45%,transparent 65%); transform:translateX(-110%); animation:shimmer 1.2s ease-in-out 1; }
          @keyframes shimmer { to { transform:translateX(110%); } }
          .card-art img { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; }
          .card-chip { z-index:2; font-size:6px; border-width:1.5px; } .grid-chip { z-index:2; font-size:7px; border-width:1.5px; }
          .card > strong { margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
          .card .category { display:none; }
          .card-footer { margin-top:4px; } .card-footer small { font-size:7px; }
          .game-screen { padding-bottom:calc(18px + env(safe-area-inset-bottom)); }
          .game-head { grid-template-columns:40px 1fr 1fr 40px; gap:6px; }
          .game-head .mini { padding:6px 4px; } .game-head .mini b { font-size:14px; } .game-head .mini span { font-size:6px; }
          .now-playing { margin:6px 0; } .now-playing strong { font-family:"Arial Black",system-ui,sans-serif; font-size:16px; } .now-playing span { font-size:7px; }
          .board-frame { width:min(100%,455px); padding:6px; border-width:3px; border-radius:17px; box-shadow:0 4px 0 var(--ink); }
          .board { gap:2px; padding:2px; border-radius:10px; } .tile { border-radius:5px; }
          .controls { margin-top:9px; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
          .control { min-width:0; min-height:52px; padding:4px; border-width:2.5px; border-radius:12px; font-size:18px; box-shadow:0 3px 0 var(--ink); }
          .control span { font-size:7px; }
          .game-help { min-height:38px; margin-top:7px; border-width:2px; font-size:8px; }
          .progress { min-height:38px; margin-top:7px; padding:7px 9px; font-size:8px; }
          .overlay { inset:6px; padding:12px; border-radius:12px; background:rgba(23,23,24,.985); backdrop-filter:none; gap:9px; }
          .overlay h2 { font-family:"Arial Black",system-ui,sans-serif; font-size:21px; }
          .overlay p { font-size:9px; } .overlay img { width:min(76%,285px); border-width:3px; border-radius:12px; }
          .overlay-actions { gap:7px; } .overlay-actions .action { min-height:45px; font-size:9px; }
          .guide-overlay { align-content:center; padding:14px 11px; }
          .guide-kicker { padding:4px 7px; border:1.5px solid var(--yellow2); border-radius:99px; color:var(--yellow2); font-size:7px; font-weight:1000; letter-spacing:.7px; }
          .quick-guide { width:100%; display:grid; gap:6px; }
          .quick-step { display:grid; grid-template-columns:29px 1fr; gap:7px; align-items:center; padding:7px; border:1.5px solid rgba(255,255,255,.2); border-radius:10px; background:rgba(255,255,255,.06); }
          .quick-step > b { width:29px; height:29px; display:grid; place-items:center; border-radius:50%; background:var(--red); color:white; font-family:"Arial Black",system-ui,sans-serif; font-size:13px; }
